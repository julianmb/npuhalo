name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, or unsanitized system logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest command or code sample that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: npuhalo revision
      placeholder: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Python, kernel, driver, runtime, firmware, and model identifiers. Remove usernames and private paths.
    validations:
      required: true
